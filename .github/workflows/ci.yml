name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  headless-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless fixture dependency
        run: python -m pip install "ezdxf>=1.4,<2"
      - name: Compile benchmark scripts
        run: python -m compileall -q scripts
      - name: Validate provider registry JSON
        run: python -m json.tool registry/providers.json > /dev/null
      - name: Validate watchlist JSON
        run: python -m json.tool registry/watchlist.json > /dev/null
      - name: Generate architectural fixture
        run: python scripts/generate_fixtures.py
      - name: Score checked-in benchmark results
        run: python scripts/score_results.py
